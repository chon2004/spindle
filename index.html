$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if(!b) return;
  if(detail && ovStack[ovStack.length-1] === closeDetail){ ovStack.pop(); try{ history.back(); }catch(e){} }
  tab = b.dataset.tab; detail = null; query = ''; $('#search').value = '';
  buildTabs(); render(); $('#main').scrollTop = 0;
});

$('#main').addEventListener('click', e => {
  const main = $('#main');
  const more = e.target.closest('[data-more]');
  if(more){ e.stopPropagation(); trackSheet(more.dataset.more); return; }

  const act = e.target.closest('[data-act]');
  if(act){
    const a = act.dataset.act;
    if(a === 'add') $('#filePick').click();
    if(a === 'newlist') newPlaylist();
    if(a === 'sort'){
      openSheet('<div id="sheetHead"><div class="t">Sort songs by</div></div>'
        + Object.entries(SORTS).map(([k,v]) =>
            '<button class="sheetItem" data-s="sortby" data-val="' + k + '">'
            + (k === S.sort ? SI.check : '<span style="width:18px"></span>')
            + v.name + '</button>').join(''));
    }
    if(a === 'reorder'){ reorderMode = !reorderMode; render(); }
    if(a === 'playall'){ shuffle = false; playList(main._ids, main._ids[0], main._label); openPlayer(); }
    if(a === 'shuffleall'){ shuffle = true; playList(main._ids, null, main._label); openPlayer(); }
    if(a === 'artistmenu' && detail){
      const g = groupArtists().find(x => x.key === detail.key);
      openSheet('<div id="sheetHead"><div class="t">' + esc(g ? g.name : 'Artist') + '</div></div>'
        + '<button class="sheetItem" data-s="artistcover" data-id="' + esc(detail.key) + '">'
        + SI.image + 'Choose a cover</button>'
        + (artBlobs.has(artistArtKey(detail.key))
            ? '<button class="sheetItem" data-s="artistcoveroff" data-id="' + esc(detail.key) + '">'
              + SI.undo + 'Use the first album instead</button>'
            : ''));
      return;
    }
    if(a === 'listmenu' && detail){
      const l = lists.find(x => x.id === detail.key);
      openSheet('<div id="sheetHead"><div class="t">' + esc(l.name) + '</div></div>'
        + '<button class="sheetItem" data-s="rename" data-id="' + l.id + '">' + SI.pen + 'Rename</button>'
        + '<button class="sheetItem" data-s="listcover" data-id="' + l.id + '">' + SI.image + 'Choose a cover</button>'
        + (artBlobs.has(listArtKey(l.id))
            ? '<button class="sheetItem" data-s="listcoveroff" data-id="' + l.id + '">'
              + SI.undo + 'Use the first track instead</button>'
            : '')
        + '<button class="sheetItem danger" data-s="dellist" data-id="' + l.id + '">' + SI.trash + 'Delete playlist</button>');
    }
    return;
  }
  if(e.target.closest('#back')){ ovBack(); return; }

  const alb = e.target.closest('[data-album]');
  if(alb){ openDetail({kind:'album', key:alb.dataset.album}); return; }
  const art = e.target.closest('[data-artist]');
  if(art){ openDetail({kind:'artist', key:art.dataset.artist}); return; }
  const lst = e.target.closest('[data-list]');
  if(lst){ openDetail({kind:'list', key:lst.dataset.list}); return; }

  const mv = e.target.closest('[data-move]');
  if(mv){
    e.stopPropagation();
    moveInPlaylist(mv.dataset.id, mv.dataset.move === 'up' ? -1 : 1);
    return;
  }
  const sm = e.target.closest('[data-smart]');
  if(sm){ openDetail({kind:'smart', key:sm.dataset.smart}); return; }

  const row = e.target.closest('.row[data-id]');
  if(!row) return;
  if(selectMode){
    const id = row.dataset.id;
    if(selected.has(id)) selected.delete(id); else selected.add(id);
    row.classList.toggle('sel', selected.has(id));
    paintSelCount();
    return;
  }
  playList(main._ids, row.dataset.id, main._label);
});

async function moveInPlaylist(id, dir){
  if(!detail || detail.kind !== 'list') return;
  const l = lists.find(x => x.id === detail.key);
  if(!l) return;
  const i = l.trackIds.indexOf(id), j = i + dir;
  if(i < 0 || j < 0 || j >= l.trackIds.length) return;
  [l.trackIds[i], l.trackIds[j]] = [l.trackIds[j], l.trackIds[i]];
  await put('lists', l);
  render();
}

$('#selbar').addEventListener('click', async e => {
  const b = e.target.closest('[data-sel]'); if(!b) return;
  const what = b.dataset.sel;
  if(what === 'done') return exitSelect();
  if(what === 'all'){
    const ids = $('#main')._ids || [];
    if(selected.size >= ids.length) selected.clear();
    else ids.forEach(id => selected.add(id));
    render(); paintSelCount(); return;
  }
  if(!selected.size){ toast('Nothing selected'); return; }
  if(what === 'playlist'){
    const ids = [...selected];
    openSheet('<div id="sheetHead"><div class="t">Add ' + ids.length + ' to playlist</div></div>'
      + '<button class="sheetItem" data-s="bulknew">' + SI.list + 'New playlist</button>'
      + lists.map(l => '<button class="sheetItem" data-s="bulkadd" data-list="' + l.id + '">'
          + SI.list + esc(l.name) + '</button>').join(''));
    return;
  }
  if(what === 'remove'){
    const ids = [...selected];
    const ok = await confirmAsk('Remove ' + ids.length
      + (ids.length===1 ? ' track from your library?' : ' tracks from your library?'), 'Remove');
    if(!ok) return;
    for(const id of ids) await removeTrack(id, true);
    exitSelect();
    toast('Removed ' + ids.length + (ids.length===1?' track':' tracks'));
  }
});
$('#main').addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest('.row[data-id]');
  if(row){ e.preventDefault(); playList($('#main')._ids, row.dataset.id, $('#main')._label); }
});

$('#sheet').addEventListener('click', async e => {
  if(e.target.closest('#grab')) return closeSheet();
  const b = e.target.closest('[data-s]'); if(!b) return;
  const {s, id} = b.dataset;
  if(s === 'playnext'){ if(qIndex >= 0){ queue.splice(qIndex+1, 0, id); toast('Playing next'); } else playList([id], id, 'Queue'); }
  if(s === 'enqueue'){ if(qIndex >= 0){ queue.push(id); toast('Added to queue'); } else playList([id], id, 'Queue'); }
  if(s === 'addfiles'){ closeSheetRaw(); $('#filePick').click(); return; }
  if(s === 'addfolder'){ closeSheetRaw(); $('#dirPick').click(); return; }
  if(s === 'dorestore'){ closeSheetRaw(); $('#backupPick').click(); return; }
  if(s === 'dobackup'){ closeSheetRaw(); exportBackup(); return; }
  if(s === 'fav'){ closeSheetRaw(); return toggleFav(id); }
  if(s === 'select'){ closeSheetRaw(); return enterSelect(id); }
  if(s === 'sortby'){ S.sort = b.dataset.val; tracks.sort(sortTracks); saveSettings(); }
  if(s === 'unlist' && detail && detail.kind === 'list'){
    const l = lists.find(x => x.id === detail.key);
    if(l){
      l.trackIds = l.trackIds.filter(x => x !== id);
      await put('lists', l); render(); toast('Removed from ' + l.name);
    }
  }
  if(s === 'toplaylist'){ closeSheet(); return playlistSheet(id); }
  if(s === 'createwith'){ closeSheet(); return newPlaylist(id); }
  if(s === 'addto') await addToList(b.dataset.list, id);
  if(s === 'bulkadd'){
    const l = lists.find(x => x.id === b.dataset.list);
    if(l){
      for(const tid of selected) if(!l.trackIds.includes(tid)) l.trackIds.push(tid);
      await put('lists', l);
      toast('Added ' + selected.size + ' to ' + l.name);
      exitSelect();
    }
  }
  if(s === 'bulknew'){
    closeSheetRaw();
    const name = await ask('New playlist', '', 'Create');
    if(name){
      const l = {id: uid(), name, trackIds: [...selected]};
      lists.push(l); await put('lists', l);
      toast('Created ' + name + ' with ' + l.trackIds.length);
      exitSelect();
    }
    return;
  }
  if(s === 'edit'){ closeSheetRaw(); return openEditor(id, true); }
  if(s === 'goalbum'){ const t = trackById(id); query=''; $('#search').value=''; openDetail({kind:'album', key:albumKey(t)}); }
  if(s === 'goartist'){ const t = trackById(id); query=''; $('#search').value=''; openDetail({kind:'artist', key:artistOf(t).toLowerCase()}); }
  if(s === 'remove'){ closeSheet(); return removeTrack(id); }
  if(s === 'jump'){ const i = queue.indexOf(id); if(i >= 0){ qIndex = i; start(); } }
  if(s === 'rename'){
    const l = lists.find(x => x.id === id);
    const n = await ask('Rename playlist', l.name, 'Rename');
    if(n){ l.name = n; await put('lists', l); render(); }
  }
  if(s === 'artistcover'){
    artPickFor = 'artist'; artPickArtist = id;
    closeSheetRaw(); $('#artPick').click();
    return;
  }
  if(s === 'artistcoveroff'){
    const key = artistArtKey(id);
    artBlobs.delete(key); dropArtUrl(key);
    try{ await del('art', key); }catch(e){}
    render(); paint(); toast('Back to the first album');
  }
  if(s === 'listcover'){
    artPickFor = 'list'; artPickList = id;
    closeSheetRaw(); $('#artPick').click();
    return;
  }
  if(s === 'listcoveroff'){
    const key = listArtKey(id);
    artBlobs.delete(key); dropArtUrl(key);
    try{ await del('art', key); }catch(e){}
    render(); paint(); toast('Back to the first track');
  }
  if(s === 'dellist'){
    lists = lists.filter(x => x.id !== id);
    const key = listArtKey(id);
    artBlobs.delete(key); dropArtUrl(key);
    try{ await del('lists', id); await del('art', key); }catch(e){}
    detail = null; render(); toast('Playlist deleted');
  }
  closeSheet();
});
$('#scrim').onclick = () => { if($('#ask').classList.contains('up')) ovBack(); else closeSheetRaw(); };

$('#miniRow').addEventListener('click', e => {
  if(e.target.closest('#miniPlay')) return toggle();
  if(e.target.closest('#miniNext')) return next();
  openPlayer();
});
$('#pClose').onclick = () => ovBack();
$('#pPlay').onclick = toggle;
$('#pNext').onclick = () => next();
$('#pPrev').onclick = prev;
$('#pMore').onclick = () => { const t = current(); if(t) trackSheet(t.id); };
$('#pQueue').onclick = queueSheet;
$('#pAddTo').onclick = () => { const t = current(); if(t) playlistSheet(t.id); };
$('#pShuffle').onclick = () => {
  shuffle = !shuffle;
  const cur = current()?.id;
  if(queue.length && cur){
    queue = shuffle ? shuffled(queue, cur) : ($('#main')._ids?.slice() || queue.slice());
    qIndex = Math.max(0, queue.indexOf(cur));
  }
  paint(); toast(shuffle ? 'Shuffle on' : 'Shuffle off');
};
$('#pRepeat').onclick = () => {
  repeat = repeat === 'off' ? 'all' : repeat === 'all' ? 'one' : 'off';
  paint();
  toast(repeat === 'off' ? 'Repeat off' : repeat === 'all' ? 'Repeat all' : 'Repeat one');
};

const trackEl = $('#track');
function seekAt(clientX){
  const r = trackEl.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  const d = isFinite(au.duration) ? au.duration : (current()?.duration || 0);
  $('#trackFill').style.width = (p*100) + '%';
  $('#trackDot').style.left = (p*100) + '%';
  $('#tNow').textContent = fmt(p*d);
  return p*d;
}
trackEl.addEventListener('pointerdown', e => {
  if(!current()) return;
  dragging = true; trackEl.classList.add('grab');
  trackEl.setPointerCapture(e.pointerId); seekAt(e.clientX);
});
trackEl.addEventListener('pointermove', e => { if(dragging) seekAt(e.clientX); });
trackEl.addEventListener('pointerup', e => {
  if(!dragging) return;
  const t = seekAt(e.clientX);
  dragging = false; trackEl.classList.remove('grab');
  if(isFinite(t)) au.currentTime = t;
});
trackEl.addEventListener('pointercancel', () => { dragging = false; trackEl.classList.remove('grab'); });

let sy = null;
$('#player').addEventListener('touchstart', e => {
  if(e.target.closest('#track')) return;
  sy = e.touches[0].clientY;
}, {passive:true});
$('#player').addEventListener('touchend', e => {
  if(sy == null) return;
  const dy = e.changedTouches[0].clientY - sy; sy = null;
  if(dy > 90) ovBack();
}, {passive:true});

document.addEventListener('keydown', e => {
  if(e.target.matches('input')) return;
  if(e.key === ' '){ e.preventDefault(); toggle(); }
  if(e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') prev();
  if(e.key === 'Escape'){
    if($('#sheet').classList.contains('up')) closeSheetRaw();
    else ovBack();
  }
});

/* ---------------- offline ---------------- */
const SHELL = ['./', './index.html', './manifest.webmanifest',
               './icon-192.png', './icon-512.png',
               './sc-shuffle.png', './sc-resume.png', './sc-lists.png'];
let swState = {state:'unknown', detail:''};

async function setupOffline(){
  if(!('serviceWorker' in navigator)){
    swState = {state:'unsupported', detail:'This browser has no service worker support.'};
    return;
  }
  if(!window.isSecureContext){
    swState = {state:'insecure', detail:'Offline needs an https page.'};
    return;
  }
  const here = location.href.split('?')[0].split('#')[0];
  const dir  = here.endsWith('/') ? here : here.replace(/\/[^/]*$/, '/');
  const bases = [new URL('.', here).href, dir, here.replace(/\/$/, '') + '/'];
  const names = ['sw.js'];
  const tries = [];
  for(const base of bases) for(const nm of names) tries.push(base + nm);

  const waitReady = () => Promise.race([
    navigator.serviceWorker.ready.then(() => true),
    new Promise(r => setTimeout(() => r(false), 4000))      // never block on a scope we can't match
  ]);
  const waitController = async () => {
    for(let i = 0; i < 20 && !navigator.serviceWorker.controller; i++)
      await new Promise(r => setTimeout(r, 120));
    return !!navigator.serviceWorker.controller;
  };

  const seen = new Set();
  const attempts = [];
  let lastErr = '', scopes = [];
  for(const u of tries){
    if(seen.has(u)) continue;
    seen.add(u);
    const scope = u.slice(0, u.lastIndexOf('/') + 1);       // a worker may only claim its own folder
    try{
      await navigator.serviceWorker.register(u, {scope});
      scopes.push(scope);
      await waitReady();
      if(await waitController()){ swState = {state:'active', detail:u}; return; }
      lastErr = 'worker active at ' + scope + ', but this page sits outside that folder';
    }catch(e){
      const m = (e && e.message) || String(e);
      const code = (m.match(/\((\d{3})\)|code \((\d{3})\)|\b(40\d|50\d)\b/) || [])
                     .filter(Boolean).pop();
      attempts.push(u.split('/').pop() + (code ? ' → ' + code : ' → refused'));
      lastErr = m;
    }
  }

  // A worker can only control URLs inside its own folder. When the page is served
  // without a trailing slash it falls just outside, so move to the folder form once.
  if(scopes.length && !here.endsWith('/') && !sessionStorage.getItem('spindle-slash')){
    const slashed = here.replace(/\/$/, '') + '/';
    if(scopes.some(sc => slashed.indexOf(sc) === 0)){
      try{
        const probe = await fetch(slashed, {cache:'no-store'});
        if(probe.ok){
          sessionStorage.setItem('spindle-slash','1');
          location.replace(slashed);
          return;
        }
      }catch(e){}
    }
  }

  const summary = attempts.length ? attempts.join(', ') : (lastErr || 'registration refused');
  swState = scopes.length ? {state:'registered', detail:lastErr}
                          : {state:'failed', detail: summary};
}

async function cachedCount(){
  try{
    let n = 0;
    for(const k of await caches.keys()){
      n += (await (await caches.open(k)).keys()).length;
    }
    return n;
  }catch(e){ return 0; }
}
/* pull the shell (and the fonts already in use) through the worker so they land in its cache */
async function primeOffline(){
  if(swState.state === 'unsupported' || swState.state === 'insecure'){
    toast('Offline is not available in this browser'); return;
  }
  toast('Saving for offline use…');
  await setupOffline();
  if(swState.state === 'failed'){
    toast("Couldn't set up offline here — tell Claude what Settings reports");
    buildSettings(); return;
  }
  try{ await navigator.serviceWorker.ready; }catch(e){}
  const fonts = performance.getEntriesByType('resource')
    .map(r => r.name)
    .filter(u => /fonts\.(googleapis|gstatic)\.com/.test(u));
  await Promise.allSettled(
    SHELL.map(u => fetch(u, {cache:'reload'}))
      .concat(fonts.map(u => fetch(u, {mode:'no-cors'})))
  );
  const n = await cachedCount();
  await readUsage();
  buildSettings();
  toast(n ? 'Ready offline — ' + n + ' files saved' : "Nothing could be saved");
}

/* ---------------- launch shortcuts ---------------- */
/* Long-pressing the installed icon opens ./?do=… — act on it, then tidy the URL. */
async function handleLaunchAction(){
  let act = null;
  try{ act = new URLSearchParams(location.search).get('do'); }catch(e){}
  if(!act) return;
  try{ history.replaceState({}, '', location.pathname); }catch(e){}

  if(act === 'shuffle' && tracks.length){
    shuffle = true;
    await playList(tracks.map(t => t.id), null, 'Everything');
    openPlayer();
  }
  else if(act === 'resume'){
    if(current()){
      try{ await au.play(); }catch(e){ toast('Tap play to start'); }
      openPlayer();
    } else if(tracks.length){
      await playList(tracks.map(t => t.id), tracks[0].id, 'Songs');
      openPlayer();
    }
  }
  else if(act === 'playlists'){
    if(!S.tabs.includes('playlists')) S.tabs = S.tabs.concat('playlists');
    tab = 'playlists'; detail = null;
    buildTabs(); render();
  }
}

/* ---------------- boot ---------------- */
(async () => {
  try{ await load(); }
  catch(e){ toast('Storage unavailable in this browser'); }
  applySettings();
  render();
  $('#miniPlay').innerHTML = icon('play', 21);
  $('#pPlay').innerHTML = icon('play', 27);
  applySpeed();
  if(!fxNeutral()) applySound(false);
  try{ await restorePlayback(); }catch(e){}
  paint();
  try{ await handleLaunchAction(); }catch(e){}
  if(document.readyState === 'complete') setupOffline();
  else window.addEventListener('load', setupOffline, {once:true});
})();
</script>
